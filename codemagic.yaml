workflows:
  android-debug:
    name: FeaturesHub Android Debug Build

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/v0.0.1
          include: true

    max_build_duration: 60

    environment:
      node: 22
      java: 17

    cache:
      cache_paths:
        - ~/.npm
        - node_modules
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build Android Release APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk