workflows:
  android-debug:
    name: FeaturesHub Android Debug Build

    max_build_duration: 60

    environment:
      node: 22
      java: 17
      groups:
        - android

    cache:
      cache_paths:
        - ~/.npm
        - node_modules
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Run Lint (optional but good practice)
        script: |
          npm run lint || true

      - name: Build Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

